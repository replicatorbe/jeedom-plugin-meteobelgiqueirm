<div class="cmd cmd-widget #history#" data-type="info" data-subtype="string" data-template="meteobelgiqueirm" data-level="" data-stale="0" data-cmd_id="#id#" data-cmd_uid="#uid#" data-version="#version#" data-eqLogic_id="#eqLogic_id#">
  <div class="title #hide_name#">
    <div class="cmdName">#name_display#</div>
  </div>
  <div class="content">
    <div class="mbiWarning"></div>
    <div class="mbiNow">
      <i class="mbiIcon"></i>
      <span class="mbiTemp"></span>
    </div>
    <div class="mbiCondition"></div>
    <div class="mbiRain"></div>
    <div class="mbiRange"></div>
    <div class="mbiHours"></div>
    <div class="mbiDays"></div>
    <div class="mbiAge"></div>
  </div>
  <div class="timeCmd label label-default #history#" data-type="info"></div>
  <template>
    <div>days : 0 ({{Masque la bande des trois prochains jours}})</div>
    <div>rain : 0 ({{Masque la ligne de pluie à courte échéance}})</div>
    <div>range : 0 ({{Masque les températures minimale et maximale du jour}})</div>
    <div>hours : 0 ({{Masque la bande heure par heure}})</div>
  </template>
  <script>
    (function () {
      /* Une seule feuille de style pour toutes les tuiles du plugin, posée au
         premier rendu. Le CSS d'un plugin n'est pas chargé sur le dashboard, et
         les règles .content du coeur n'existent pas côté mobile : le gabarit doit
         se suffire à lui-même. Aucune couleur en dur, tout vient du thème. */
      if (!document.getElementById('meteobelgiqueirmWidgetCss')) {
        var css = document.createElement('style')
        css.id = 'meteobelgiqueirmWidgetCss'
        css.textContent = [
          '.cmd-widget[data-template="meteobelgiqueirm"]{display:flex;flex-direction:column;align-items:center;width:100%}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .cmdName{font-size:12px;line-height:16px;font-weight:400;color:var(--txt-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .content{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:0 4px 2px;gap:2px}',
          /* Le bandeau d'avertissement est le seul élément qui a le droit de crier. */
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiWarning{display:none;width:100%;padding:3px 6px;font-size:.82em;font-weight:700;line-height:1.3;text-align:center;border-radius:var(--border-radius);overflow-wrap:anywhere}',
          '.cmd-widget[data-template="meteobelgiqueirm"][data-level="1"] .mbiWarning{display:block;background:var(--al-warning-color);color:#1E1E1E}',
          /* Le coeur ne définit que deux couleurs d'alerte, warning et danger :
             il n'y a pas d'orange. On le fabrique en mélangeant le rouge du
             thème, ce qui reste cohérent en thème clair comme en sombre. La
             première déclaration est le repli : un navigateur qui ne connaît pas
             color-mix ignore la seconde et garderait sinon un bandeau sans fond,
             donc illisible. */
          '.cmd-widget[data-template="meteobelgiqueirm"][data-level="2"] .mbiWarning{display:block;background:#E8730C;color:#1E1E1E}',
          '.cmd-widget[data-template="meteobelgiqueirm"][data-level="2"] .mbiWarning{background:color-mix(in srgb, var(--al-danger-color) 62%, #FFB020)}',
          '.cmd-widget[data-template="meteobelgiqueirm"][data-level="3"] .mbiWarning{display:block;background:var(--al-danger-color);color:#FFFFFF}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiNow{display:flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiIcon{font-size:1.9em;color:var(--txt-color);opacity:.9}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiTemp{font-size:1.9em;font-weight:700;color:var(--txt-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiCondition{font-size:.86em;color:var(--txt-color);opacity:.85;text-align:center;line-height:1.25}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiRain{font-size:.86em;font-weight:600;color:var(--txt-color);text-align:center;line-height:1.3}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiRain.mbiRainSoon{color:var(--al-warning-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiRange{font-size:.82em;color:var(--txt-color);opacity:.75}',
          /* Bande heure par heure. Les colonnes se replient plutôt que de
             défiler : un widget dans lequel il faut faire glisser du doigt pour
             voir l'après-midi ne répond pas à la question qu'on lui pose. */
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHours{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;width:100%;margin-top:4px}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHour{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:30px;flex:1 1 30px;max-width:46px;font-size:.72em;line-height:1.2;color:var(--txt-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHourTime{opacity:.7}',
          /* L'icône était à 1,05em d'un texte déjà réduit, soit neuf pixels :
             affichée, et pourtant invisible. Elle est maintenant dimensionnée
             pour être lue, pas seulement pour être présente. */
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHour > i{font-size:1.55em;line-height:1;opacity:.95}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHourTemp{font-weight:600}',
          /* Le changement de jour est marqué par un trait : sans lui, « 23 »
             suivi de « 0 » se lit comme une erreur. */
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHour.mbiNewDay{border-left:1px solid var(--txt-color);padding-left:2px;margin-left:2px;opacity:.9}',
          /* La hauteur de la barre porte le risque de pluie. Le chiffre serait
             illisible à cette taille ; la silhouette de la bande, elle, se lit
             d\'un coup d\'oeil. */
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHourBar{display:flex;align-items:flex-end;width:62%;height:14px;border-radius:2px;background:var(--btnEq-default-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiHourBar > span{display:block;width:100%;border-radius:1px;background:var(--al-info-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiDays{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;margin-top:3px}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiDay{display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px 5px;font-size:.76em;line-height:1.25;border-radius:var(--border-radius);background:var(--btnEq-default-color);color:var(--txt-color)}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiDayName{font-weight:600}',
          '.cmd-widget[data-template="meteobelgiqueirm"] .mbiAge{font-size:.74em;color:var(--txt-color);opacity:.6;margin-top:2px}',
          /* Une donnée périmée doit se voir : la couleur seule ne suffit pas,
             le texte dit l\'heure du relevé. */
          '.cmd-widget[data-template="meteobelgiqueirm"][data-stale="1"] .mbiAge{color:var(--al-danger-color);opacity:1;font-weight:600}'
        ].join('')
        document.head.appendChild(css)
      }

      /* Options de widget : l'utilisateur peut alléger la tuile sans qu'on ait à
         créer d'autres commandes. */
      var mbiShowDays = !(domUtils.issetWidgetOptParam('#days#', 'days') && '#days#' == '0')
      var mbiShowRain = !(domUtils.issetWidgetOptParam('#rain#', 'rain') && '#rain#' == '0')
      var mbiShowRange = !(domUtils.issetWidgetOptParam('#range#', 'range') && '#range#' == '0')
      var mbiShowHours = !(domUtils.issetWidgetOptParam('#hours#', 'hours') && '#hours#' == '0')

      /* Le nombre de minutes est recalculé ici, à chaque rendu, à partir de
         l'instant du relevé : une durée figée côté serveur vieillirait mal entre
         deux passages du cron, et surtout elle changerait la valeur de la
         commande à chaque minute, ce qui réveillerait les scénarios pour rien. */
      function mbiAgeLabel(_fetched) {
        if (!_fetched) { return '' }
        var minutes = Math.floor((Date.now() / 1000 - _fetched) / 60)
        if (minutes < 0) { minutes = 0 }
        if (minutes < 60) { return '{{relevé il y a}} ' + minutes + ' {{min}}' }
        var when = new Date(_fetched * 1000)
        var hh = ('0' + when.getHours()).slice(-2)
        var mm = ('0' + when.getMinutes()).slice(-2)
        return '{{données de}} ' + hh + ':' + mm
      }

      jeedom.cmd.addUpdateFunction('#id#', function (_options) {
        var cmd = document.querySelector('.cmd[data-cmd_uid="#uid#"]')
        if (!is_object(cmd)) { return }

        /* Un seul objet transporte toute la tuile : deux commandes distinctes
           demanderaient deux rafraîchissements qui pourraient se croiser et
           afficher une température avec l'icône de la veille. */
        var data = null
        try {
          data = JSON.parse(_options.value)
        } catch (_error) {
          data = null
        }

        var warning = cmd.querySelector('.mbiWarning')
        var icon = cmd.querySelector('.mbiIcon')
        var temp = cmd.querySelector('.mbiTemp')
        var condition = cmd.querySelector('.mbiCondition')
        var rain = cmd.querySelector('.mbiRain')
        var range = cmd.querySelector('.mbiRange')
        var hours = cmd.querySelector('.mbiHours')
        var days = cmd.querySelector('.mbiDays')
        var age = cmd.querySelector('.mbiAge')

        /* Rien reçu : surtout pas de zéro ni de pastille verte. Une commune qui
           vient d'être créée affirmerait qu'il fait 0 °C alors qu'elle ne sait
           rien encore. */
        if (data === null) {
          cmd.setAttribute('data-level', '')
          cmd.setAttribute('data-stale', '0')
          icon.className = 'mbiIcon fas fa-hourglass-half'
          temp.textContent = ''
          condition.textContent = '{{En attente des données de l\'IRM}}'
          rain.textContent = ''
          range.textContent = ''
          hours.innerHTML = ''
          days.innerHTML = ''
          age.textContent = ''
          return
        }

        /* --- Avertissement --- */
        var level = (data.warning && data.warning.level > 0) ? data.warning.level : 0
        cmd.setAttribute('data-level', level > 0 ? String(level) : '')
        if (level > 0) {
          /* Le niveau est écrit en toutes lettres en plus de la couleur : la
             tuile doit rester lisible en noir et blanc, et par quelqu'un qui ne
             distingue pas le rouge de l'orange. */
          warning.textContent = data.warning.label || ''
        } else if (data.next_warning && data.next_warning.level > 0 && data.next_warning.start) {
          /* Rien en cours, mais quelque chose est annoncé : c'est ce bandeau-là
             qui laisse le temps de rentrer les meubles de jardin. Il emprunte la
             couleur du niveau annoncé, en plus discret. */
          cmd.setAttribute('data-level', String(data.next_warning.level))
          warning.textContent = '{{Annoncé}} · ' + data.next_warning.start
        } else {
          warning.textContent = ''
        }

        /* --- Instant présent --- */
        icon.className = 'mbiIcon ' + (data.icon || 'fas fa-question')
        temp.textContent = (data.temp === null || data.temp === undefined) ? '' : Math.round(data.temp) + '°'
        condition.textContent = data.condition || ''

        /* --- Pluie à courte échéance : l'information la plus actionnable de
           l'écran, c'est elle qui fait rentrer le linge. --- */
        rain.className = 'mbiRain'
        if (!mbiShowRain) {
          rain.textContent = ''
        } else if (data.rain && data.rain.next >= 0) {
          rain.textContent = (data.rain.next === 0)
            ? '{{pluie en cours}}'
            : '{{pluie dans}} ' + data.rain.next + ' {{min}}'
          rain.className = 'mbiRain mbiRainSoon'
        } else if (data.rain && data.rain.hint) {
          rain.textContent = data.rain.hint
        } else {
          rain.textContent = ''
        }

        /* --- Min et max du jour --- */
        if (mbiShowRange && (data.tmin !== null || data.tmax !== null)) {
          var low = (data.tmin === null || data.tmin === undefined) ? '-' : Math.round(data.tmin) + '°'
          var high = (data.tmax === null || data.tmax === undefined) ? '-' : Math.round(data.tmax) + '°'
          range.textContent = low + ' / ' + high
        } else {
          range.textContent = ''
        }

        /* --- Heure par heure, jusqu'à la fin de la journée. --- */
        hours.innerHTML = ''
        if (mbiShowHours && data.hours && data.hours.length) {
          for (var n = 0; n < data.hours.length; n++) {
            var hour = data.hours[n]
            var col = document.createElement('div')
            col.className = 'mbiHour' + (hour.n ? ' mbiNewDay' : '')

            var when = document.createElement('span')
            when.className = 'mbiHourTime'
            when.textContent = String(hour.h)
            col.appendChild(when)

            var hourIcon = document.createElement('i')
            hourIcon.className = hour.i || 'fas fa-question'
            col.appendChild(hourIcon)

            var hourTemp = document.createElement('span')
            hourTemp.className = 'mbiHourTemp'
            hourTemp.textContent = (hour.t === null || hour.t === undefined) ? '' : hour.t + '°'
            col.appendChild(hourTemp)

            var bar = document.createElement('span')
            bar.className = 'mbiHourBar'
            var fill = document.createElement('span')
            /* Un risque nul laisse la barre vide plutôt que de la masquer : une
               colonne plus courte que ses voisines se remarque, une colonne
               absente déforme la bande. */
            var risk = (hour.r === null || hour.r === undefined) ? 0 : hour.r
            fill.style.height = Math.max(0, Math.min(100, risk)) + '%'
            bar.appendChild(fill)
            bar.title = '{{Risque de pluie}} : ' + risk + ' %'
            col.appendChild(bar)

            hours.appendChild(col)
          }
        }

        /* --- Trois jours. Sept seraient illisibles dans 300 px, et « faut-il
           étendre le linge demain » se décide sur trois. --- */
        days.innerHTML = ''
        if (mbiShowDays && data.days && data.days.length) {
          for (var i = 0; i < data.days.length; i++) {
            var day = data.days[i]
            var box = document.createElement('div')
            box.className = 'mbiDay'

            var name = document.createElement('span')
            name.className = 'mbiDayName'
            name.textContent = day.label || ''
            box.appendChild(name)

            var dayIcon = document.createElement('i')
            dayIcon.className = day.icon || 'fas fa-question'
            box.appendChild(dayIcon)

            var values = document.createElement('span')
            var dmin = (day.tmin === null || day.tmin === undefined) ? '-' : Math.round(day.tmin) + '°'
            var dmax = (day.tmax === null || day.tmax === undefined) ? '-' : Math.round(day.tmax) + '°'
            values.textContent = dmin + '/' + dmax
            box.appendChild(values)

            days.appendChild(box)
          }
        }

        /* --- Fraîcheur --- */
        cmd.setAttribute('data-stale', data.stale ? '1' : '0')
        age.textContent = mbiAgeLabel(data.fetched)

        if (domUtils.issetWidgetOptParam('#time#', 'time')) {
          jeedom.cmd.displayDuration(_options.valueDate, cmd.querySelector('.timeCmd'), '#time#')
        }
      })

      /* display_value reste vide : le coeur n'échappe que les apostrophes dans
         cette valeur, ce qui ne protège pas d'une balise de fermeture de script
         — et le bulletin de l'IRM est du texte libre. La tuile lit #value#,
         déjà assaini côté PHP.
         Et le mot « script » n'est pas écrit en entier entre chevrons ici, pas
         même dans ce commentaire : le navigateur ne lit pas les commentaires
         JavaScript avant de chercher la fin du bloc, il coupe à la première
         occurrence et affiche tout le reste en texte brut. */
      jeedom.cmd.refreshValue([{ cmd_id: '#id#', value: '#value#', display_value: '', valueDate: '#valueDate#', collectDate: '#collectDate#', alertLevel: '#alertLevel#', unit: '' }])
    })()
  </script>
</div>
